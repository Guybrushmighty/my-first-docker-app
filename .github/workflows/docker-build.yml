name: Docker Build CI

# 1. Trigger the automation whenever code is pushed to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    # 2. Tell GitHub to provision a clean Ubuntu virtual machine runner
    runs-on: ubuntu-latest

    steps:
    # 3. Pull down your source code into the virtual machine runner
    - name: Checkout project code
      uses: actions/checkout@v4

    # 4. Verify that the Docker environment is ready on the runner machine
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 5. Build the Docker image to make sure there are no syntax errors
    - name: Test build Docker Image
      run: |
        docker build -t my-first-web-app:test .
        echo "Docker image built successfully in the cloud pipeline!"

