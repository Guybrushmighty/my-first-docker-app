apiVersion: apps/v1
kind: Deplyment
metadata:
  name: web-app-deployment
spec:
  replicas: 3
  selector:
   matchless:
    app: frontend-web
 template:
   metadata:
     labels:
       app: frontend-web
   spec:
     containers:
       - name: web-container
         image: nginx:alpine
         ports:
          - containerPort: 80


